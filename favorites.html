<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta name="viewport"
  content="width=device-width, initial-scale=1.0">

  <title>Favorites</title>

  <link rel="stylesheet"
  href="style.css">

  <link rel="stylesheet"
  href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"/>

</head>

<body>



  <!-- PAGE TRANSITION -->

  <div class="page-transition"></div>



  <!-- HEADER -->

  <header>

    <div class="logo">

      <img src="images/logo.png">

    </div>



    <nav>

      <a href="index.html">
        Home
      </a>

    </nav>

  </header>



  <!-- TITLE -->

  <h1 class="title">

    Favorite Products ❤️

  </h1>



  <!-- FAVORITES -->

  <div class="products"
  id="favoritesContainer">

  </div>



  <script>

  const favoritesContainer =
  document.getElementById("favoritesContainer")



  let storedFavorites =
  JSON.parse(localStorage.getItem("favorites"))
  || []



  function displayFavorites(){


    favoritesContainer.innerHTML = ""



    // EMPTY

    if(storedFavorites.length === 0){

      favoritesContainer.innerHTML = `

      <h2 style="
      width:100%;
      text-align:center;
      color:#243746;
      margin-top:60px;">

      No favorite products yet ❤️

      </h2>

      `

      return

    }



    // SHOW FAVORITES

    storedFavorites.forEach((product,index) => {

      favoritesContainer.innerHTML += `

      <div class="card">

        <img src="${product.image}">



        <div class="card-overlay">

          <h2>${product.name}</h2>

        </div>



        <button
        onclick="removeFavorite(${index})"

        style="
        position:absolute;
        top:20px;
        right:20px;
        width:45px;
        height:45px;
        border:none;
        border-radius:50%;
        background:red;
        color:white;
        cursor:pointer;
        z-index:999;
        font-size:18px;">

        <i class="fa-solid fa-trash"></i>

        </button>

      </div>

      `

    })

  }



  // REMOVE FAVORITE

  function removeFavorite(index){

    storedFavorites.splice(index,1)



    localStorage.setItem(

      "favorites",

      JSON.stringify(storedFavorites)

    )



    displayFavorites()

  }



  displayFavorites()

  </script>

</body>

</html>
